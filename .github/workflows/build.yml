name: Build Static Library

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b
        add-to-path: true

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-30 \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build Static Library
      run: cmake --build build --config Release -j $(nproc)

    - name: Collect Artifacts
      run: |
        mkdir -p output/include
        # 1. 拷贝所有头文件（以后调用需要用到）
        cp KittyMemoryEx/*.hpp output/include/
        
        # 2. ★ 关键：用 NDK 自带的 llvm-strip 剥离符号表，大幅减小体积
        find build -name "libKittyMemoryEx.a" -exec $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded {} \;
        
        # 3. 拷贝已经瘦身后的静态库
        find build -name "libKittyMemoryEx.a" -exec cp {} output/ \;

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KittyMemoryEx-Static-Lib
        path: output/
        if-no-files-found: error
